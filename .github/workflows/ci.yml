name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "disposable/**", "codex/repair-horizon-recovery"]

jobs:
  focused-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact reviewed source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "P44_TESTED_SHA=$(git rev-parse HEAD)"
          echo "P44_TESTED_TREE=$(git rev-parse HEAD^{tree})"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused unit dependencies
        run: python3 -m pip install pytest pyyaml cryptography==43.0.0 psycopg2-binary==2.9.10 alembic==1.13.2
      - name: Run host-safe unit tests
        env:
          PYTHONPATH: controller
        run: |
          python3 -m pytest -q --tb=short \
            tests/test_openrouter_budget.py \
            tests/test_model_routing.py \
            tests/test_review_remediation.py \
            tests/test_comms01_release_deploy.py \
            tests/test_f2_model_identity.py \
            tests/test_auditor_bind.py \
            tests/test_retry_task_exhaust_order.py \
            tests/test_pinned_trust_session.py \
            tests/test_string_acceptance_criteria.py \
            tests/test_p40_root_cause_repair.py \
            tests/test_p43_activation.py \
            tests/test_p44_activation.py \
            tests/test_p45_activation.py \
            tests/test_p46_activation.py \
            tests/test_goal_cli.py \
            tests/test_artifact_owner.py \
            tests/test_goal_dependencies.py

  disposable-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install pytest pyyaml cryptography==43.0.0 psycopg2-binary==2.9.10 alembic==1.13.2
      - name: Prepare isolated test prerequisites on disposable CI host
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql postgresql-contrib iproute2
          sudo install -d -m 755 /etc/top-delivery
      - name: Exercise real persistence with simulated model execution
        run: |
          # Migration sources are trust anchors and must be root-owned. Keep
          # the runner checkout intact; stage a private trusted copy on this VM.
          test ! -e /root/horizon-recovery-ci
          sudo install -d -m 755 /root/horizon-recovery-ci
          sudo cp -R --no-preserve=ownership "$GITHUB_WORKSPACE/." /root/horizon-recovery-ci/
          sudo chmod -R go-w /root/horizon-recovery-ci
          sudo namei -l /root/horizon-recovery-ci/controller/migrations/versions/004_longspan_workflow.py
          sudo env PATH="$PATH" bash -c 'cd /root/horizon-recovery-ci && exec bash scripts/test-recovery-isolated.sh "$@"' -- -q --tb=short \
            controller/test_recovery_acceptance.py \
            controller/test_subworkflow_handoff.py \
            controller/test_subworkflow_handoff_integration.py
