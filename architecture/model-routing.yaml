  - test-failure-classification
  - review-packet-compression
  - documentation-and-status-updates
  - simple-test-generation
  - browser-dom-and-screenshot-inspection
  - evidence-indexing
  - bounded-mechanical-refactors
  complex_or_ambiguous_executor: cursor-composer
  handoff_requirements:
  - persist_local_output_before_audit
  - record_exact_model_revision_and_digests
  - independent_review_after_any_source_change
  - return_to_terra_for_acceptance_and_release
