    sequence: qwen_packet_kat_implementation_qwen_mechanical_check_gpt_sol_audit
    shared_worktree_writes: forbidden
    persist_each_output_before_handoff: true
    exact_model_and_response_digests: required
    local_failure: record_then_retry_or_escalate
  prohibited_for_both:
  - authority-or-2fa-decisions
  - acceptance-criteria-changes
  - migration-or-production-database-actions
  - broker-ledger-or-strategy-state
  - network-or-vm-mutation
  - release-approval
