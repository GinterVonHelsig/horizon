  transport: ssh-to-loopback-ollama-openai-compatible
  host: comms-01
  endpoint: http://127.0.0.1:11434/v1
  model: hf.co/unsloth/Qwen3.8-27B-GGUF:Qwen3.8-27B-Q4_K_M.gguf
  model_repository: unsloth/Qwen3.8-27B-GGUF
