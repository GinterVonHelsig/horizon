    revision: 06c1097efce0
    action: repull-and-validate-before-use
    reason: temporary-local-model-swap
  - provider: comms-01-local
    model: qwen2.5-coder-14b-awq
    revision: eb3172f06a6d6b3a15f08947b0668d782e4d2d2c
    action: restore-vllm-stack-and-validate-before-use
    reason: documented-prior-local-stack
  required_evidence:
  - exact_model_and_revision
  - prompt_digest
  - response_digest
  - changed_file_manifest
  - focused_test_result
  - independent_review_after_use
