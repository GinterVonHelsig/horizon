  max_context_tokens: 8192
  max_output_tokens: 1600
  use_for:
  - artifact-and-log-summarization
  - test-failure-classification
  - review-packet-compression
  - documentation-and-status-updates
  - simple-test-generation
  - browser-dom-and-screenshot-inspection
  - evidence-indexing
  - bounded-mechanical-refactors
  prohibited:
  - authority-or-2fa-decisions
  - acceptance-criteria-changes
  - migration-or-production-database-actions
  - broker-or-ledger-actions
  - release-approval
  - final-adversarial-review
